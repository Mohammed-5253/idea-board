# =============================================================================
# FILE: app/backend/alembic.ini
# WHAT: Alembic (database migration tool) configuration.
# WHY:  Schema changes must be versioned, reviewed and repeatable – the SAME migration
#       files run on your laptop (compose `migrate` service), on RDS and on Cloud SQL
#       (Argo CD PreSync Job). Never let the app create tables at startup (races between
#       replicas, no history, no downgrade path).
# NOTE: The database URL is intentionally NOT here (it would contain a password).
#       migrations/env.py builds it from the same credentials source as the app
#       (env vars or the Dapr secrets API).
# HOW:  uv run alembic upgrade head      # apply all migrations
#       uv run alembic downgrade -1      # undo the last one
#       uv run alembic history           # list revisions
# LEARN: docs/learning/10-backend-python-fastapi.md §4 (migrations)
# =============================================================================
[alembic]
script_location = %(here)s/migrations
# Revision ids are timestamped file names → chronological order is obvious in reviews.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# Migrations run in ONE transaction each (PostgreSQL supports transactional DDL):
# IF a migration fails halfway THEN nothing is applied.
transaction_per_migration = true

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
