# =============================================================================
# FILE: docker-compose.yml
# SPEC: Part 2 – "Create a docker-compose.yml file to easily run the entire stack
#       (frontend, backend, database) for local development."
# WHAT: The PRODUCTION-LIKE local stack, using the same images and the same startup
#       sequence as Kubernetes:
#         db (PostgreSQL 17) → db-bootstrap (app role) → migrate (Alembic)
#           → backend (+ backend-dapr sidecar) → frontend (nginx, proxies /api)
# HOW:
#   docker compose up --build             # dev mode (this file + docker-compose.override.yml)
#   docker compose -f docker-compose.yml up --build -d --wait   # prod-like only
#   docker compose --profile tools run --rm seed                 # sample ideas
#   docker compose down        # stop (data kept)   ·   down -v   # stop + wipe the DB volume
# Then open http://localhost:8080
#
# DESIGN NOTES
# * Health-based startup order: `depends_on.condition` waits for health checks or for
#   one-shot jobs to EXIT 0. IF migrations fail THEN the backend never starts (fail fast,
#   same behaviour as the Argo CD PreSync hooks in Kubernetes).
# * Dapr sidecar: `backend-dapr` shares the backend's network namespace
#   (`network_mode: service:backend`), so the backend reaches Dapr at localhost:3500 –
#   exactly like a sidecar container in a Kubernetes pod.
# * Secrets: the Dapr local secret file is rendered by Compose from env vars (`configs:`
#   with inline content) – no generated files, no init container, nothing committed.
# * Ports bind to 127.0.0.1 only. SECURITY NOTE: binding to 0.0.0.0 would expose the DB
#   and API to anyone on your Wi-Fi.
# PRODUCTION NOTE: compose is the developer environment only; production runs on
#   Kubernetes (EKS/GKE) with managed PostgreSQL (Phases 6–8).
# LEARN: docs/learning/13-docker-compose-and-dapr-local.md
# =============================================================================

name: idea-board

# ---------------------------------------------------------------------------
# Reusable fragments (YAML anchors) – one definition, used by several services (DRY).
# ---------------------------------------------------------------------------
x-backend-image: &backend-image
  image: idea-board-backend:local
  build:
    context: ./app/backend

x-db-env: &db-env
  APP_ENV: local
  LOG_LEVEL: INFO
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ideas
  DB_SSLMODE: disable

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 17 – same major version as RDS and Cloud SQL (ADR-013)
  # -------------------------------------------------------------------------
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:-owner-local-dev-only}
      POSTGRES_DB: ideas
    volumes:
      # Named volume = data survives `docker compose down` (wiped only by `down -v`).
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"   # for psql/GUI tools on your Mac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d ideas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # One-shot: create the least-privileged app role (runs as the DB owner)
  # Kubernetes equivalent: Argo CD PreSync hook Job, sync-wave -2.
  # -------------------------------------------------------------------------
  db-bootstrap:
    <<: *backend-image
    command: ["idea-board-db-bootstrap"]
    environment:
      <<: *db-env
      DB_CREDENTIALS_SOURCE: env
      DB_USER: ideas_app
      DB_PASSWORD: ${LOCAL_DB_APP_PASSWORD:-app-local-dev-only}
      BOOTSTRAP_OWNER_USER: owner
      BOOTSTRAP_OWNER_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:-owner-local-dev-only}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # The image's HEALTHCHECK targets the API server; one-shot jobs don't serve HTTP.
    healthcheck:
      disable: true

  # -------------------------------------------------------------------------
  # One-shot: apply database migrations (owner credentials: DDL rights)
  # Kubernetes equivalent: Argo CD PreSync hook Job, sync-wave -1.
  # -------------------------------------------------------------------------
  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
      DB_CREDENTIALS_SOURCE: env
      DB_USER: owner
      DB_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:-owner-local-dev-only}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      disable: true

  # -------------------------------------------------------------------------
  # The API. Gets its DB credentials from the Dapr sidecar (DB_CREDENTIALS_SOURCE=dapr),
  # proving locally the same code path used on AWS and GCP.
  # -------------------------------------------------------------------------
  backend:
    <<: *backend-image
    environment:
      <<: *db-env
      DB_CREDENTIALS_SOURCE: dapr
      DAPR_HTTP_PORT: "3500"
      DAPR_SECRET_STORE: secretstore
      DAPR_DB_SECRET_NAME: idea-board-db-app
      FAULT_INJECTION_RATE: ${FAULT_INJECTION_RATE:-0}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"   # direct API access: /docs, /metrics, curl
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Uses the image HEALTHCHECK (/readyz). start_period covers the Dapr sidecar start.
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Dapr sidecar for the backend (Dapr 1.18.9, ADR-018). No placement/scheduler: we use
  # no actors, workflows or jobs, so those control-plane services are not needed.
  # -------------------------------------------------------------------------
  backend-dapr:
    image: daprio/daprd:1.18.9@sha256:95889439170fc923b8a04d7849331dc83ff3d6a63cb22252e0f19f68a191c34c
    command:
      - /daprd
      - --app-id=backend
      - --app-port=8000
      - --dapr-http-port=3500
      - --resources-path=/components
      - --log-as-json
      - --enable-metrics=false
    network_mode: "service:backend"   # share the backend's localhost (sidecar pattern)
    volumes:
      - ./dapr/components/local:/components:ro
    configs:
      - source: dapr_local_secrets
        target: /run/dapr-secrets/secrets.json
    depends_on:
      backend:
        condition: service_started   # the shared network namespace must exist first
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # The SPA behind unprivileged NGINX; /api is proxied to the backend (same origin).
  # -------------------------------------------------------------------------
  frontend:
    image: idea-board-frontend:local
    build:
      context: ./app/frontend
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      API_BASE_URL: ""
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Optional tools (profiles keep them OFF by default)
  # -------------------------------------------------------------------------
  seed:
    <<: *backend-image
    profiles: ["tools"]
    command: ["idea-board-seed"]
    environment:
      <<: *db-env
      DB_CREDENTIALS_SOURCE: env
      DB_USER: ideas_app
      DB_PASSWORD: ${LOCAL_DB_APP_PASSWORD:-app-local-dev-only}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      disable: true

  # Local LLM for the AI features' offline mode (C10 / ADR-010), used from Phase 9.
  # PERFORMANCE NOTE: Docker on macOS cannot use the Apple GPU, so models run on CPU here.
  #   For faster local inference install the native Ollama app instead and point the AI
  #   tooling at http://host.docker.internal:11434 (documented in Phase 9).
  ollama:
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

configs:
  # Rendered by Compose at `up` time from env vars (inline `content`), mounted read-only
  # into the Dapr sidecar. Shape matches multiValued local.file: one key per secret.
  dapr_local_secrets:
    content: |
      {
        "idea-board-db-app": {
          "username": "ideas_app",
          "password": "${LOCAL_DB_APP_PASSWORD:-app-local-dev-only}",
          "host": "db",
          "port": "5432",
          "dbname": "ideas",
          "sslmode": "disable"
        }
      }

volumes:
  pgdata:
  ollama-models:
