# =============================================================================
# FILE: docker-compose.override.yml   (auto-loaded by `docker compose up`)
# WHAT: DEVELOPER-ONLY changes on top of docker-compose.yml (ADR-014 / D-08):
#   * backend  → your source is bind-mounted; Uvicorn --reload restarts on save.
#   * frontend → the Vite dev server (hot module replacement) instead of the nginx image.
# HOW:
#   docker compose up --build                       # base + this file (dev mode)
#   docker compose -f docker-compose.yml up --build # base only (prod-like, no override)
# WHY A SEPARATE FILE? The base file stays identical to how images run in Kubernetes;
#   dev conveniences can never leak into it.
# IF you add a Python dependency THEN rebuild: `docker compose build backend`
#   (the venv lives in the image; only source code is hot-reloaded).
# COMMON MISTAKE: editing code and seeing no change in prod-like mode – that mode runs the
#   built images; use dev mode (this file) for live reload.
# =============================================================================

services:
  backend:
    # PYTHONPATH puts the mounted /app/src BEFORE the installed package in site-packages,
    # so imports resolve to your live source tree.
    environment:
      PYTHONPATH: /app/src
      LOG_PRETTY: "true"
    volumes:
      - ./app/backend/src:/app/src:ro
    command:
      - uvicorn
      - idea_board.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src

  frontend:
    # Replace the nginx image with the Node 24 image running Vite's dev server.
    image: node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    build: !reset null
    working_dir: /app
    environment:
      VITE_DEV_API_TARGET: http://backend:8000   # Vite proxies /api here (vite.config.ts)
      VITE_DEV_ALLOWED_HOSTS: frontend           # E2E browser uses the service name (403 otherwise)
    volumes:
      - ./app/frontend:/app
      # Linux node_modules live in a volume: macOS and Linux native binaries differ, so the
      # container must never use (or overwrite) your Mac's node_modules.
      - frontend-node-modules:/app/node_modules
    # Reinstall dependencies only when package-lock.json changed (hash stamp), then start
    # Vite on the same port the nginx image uses (8080), reachable from the host.
    command:
      - sh
      - -c
      - >-
        sha=$$(sha1sum package-lock.json | cut -d' ' -f1);
        [ "$$(cat node_modules/.lock-sha 2>/dev/null)" = "$$sha" ] ||
        { npm ci --no-audit --no-fund && echo "$$sha" > node_modules/.lock-sha; };
        exec npm run dev -- --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 5

volumes:
  frontend-node-modules:
