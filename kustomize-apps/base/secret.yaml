# =============================================================================
# Database passwords (two users, least privilege – same model as docker-compose):
#   postgres   → OWNER user: creates tables (migrations) and the app user. Used only by
#                Postgres itself and the backend's init containers.
#   backend-db → APP user: what the running API uses (read/write rows, no DDL).
# ⚠️ DEMO ONLY: these are placeholder passwords committed to Git. The DB is reachable only
#    inside the cluster, but real secrets must NOT live in Git. Next step: Sealed Secrets
#    or External Secrets (AWS Secrets Manager). Change both values before a real demo.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  POSTGRES_USER: owner
  POSTGRES_PASSWORD: change-me-owner
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-db
type: Opaque
stringData:
  DB_USER: ideas_app
  DB_PASSWORD: change-me-app
