# Public entry point. /api → backend, everything else → frontend (the React app).
# The controller is cloud-specific, so overlays add the class + annotations:
#   aws → AWS Load Balancer Controller (ALB)   gcp → built-in GKE Ingress (Google LB)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idea-board
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
