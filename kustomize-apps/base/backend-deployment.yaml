# =============================================================================
# Backend Deployment (FastAPI)
# CONFIG: env vars from ConfigMap `backend-config` (configmap.yaml) + Secret `backend-db`
#   (DB_HOST/DB_USER/DB_PASSWORD…, written by terraform/modules/common/app-db-secret).
#   App user only (SELECT/INSERT); schema + role are handled by the db-migrate Job
#   (db-migrate-job.yaml, Argo CD PreSync) before this Deployment is updated.
# STARTUP: the image CMD (uvicorn). PROBES: liveness /healthz (process only) · readiness
#   /readyz (DB) · startup gives up to 180 s for DB pool creation.
# SECURITY: matches PSA "restricted" + read-only root FS (/tmp is the only writable dir).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below desired capacity during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        # Prometheus (kubernetes-pods job) scrapes the app's /metrics – the health gate's data.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          image: backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while the endpoint is removed from Services/Envoy (avoids
              # 502s during rolling updates). `sleep` action needs no shell in the image.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
