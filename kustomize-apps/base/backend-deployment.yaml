# =============================================================================
# Backend Deployment (FastAPI)
# CONFIG: env vars from ConfigMap `backend-config` + Secret `backend-db` (configmap.yaml, secret.yaml).
# INIT CONTAINERS: db-bootstrap + migrate prepare the database before the API starts.
# PROBES: liveness /healthz (process only) · readiness /readyz (DB) · startup gives up to
#   60 s for the DB pool creation.
# SECURITY: matches PSA "restricted" + read-only root FS (/tmp is the only writable dir).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below desired capacity during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        # Prometheus (kubernetes-pods job) scrapes the app's /metrics – the health gate's data.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      # Run BEFORE the API starts, every time a pod starts (both steps are idempotent):
      #   1. db-bootstrap: create the least-privileged app user (as the OWNER)
      #   2. migrate:      create/upgrade tables with Alembic (as the OWNER)
      # Same image as the API, so schema and code always match.
      initContainers:
        - name: db-bootstrap
          image: backend
          command: ["idea-board-db-bootstrap"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db
          env:
            - name: BOOTSTRAP_OWNER_USER
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_USER}
            - name: BOOTSTRAP_OWNER_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: migrate
          image: backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while the endpoint is removed from Services/Envoy (avoids
              # 502s during rolling updates). `sleep` action needs no shell in the image.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
