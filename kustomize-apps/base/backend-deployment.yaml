# =============================================================================
# Backend Deployment (FastAPI)
# CONFIG: env vars from ConfigMap `backend-config` (configmap.yaml). DB credentials come from
#   the Dapr sidecar → secret store component (overlays/<cloud>/dapr-secretstore.yaml):
#   AWS Secrets Manager / GCP Secret Manager, written by terraform (aws/rds, gcp/cloudsql).
# DAPR: daprd runs as a NATIVE sidecar (terraform/modules/common/dapr): the injector appends
#   it AFTER any init containers, so our init containers could never reach it. Hence the
#   DB steps run in the backend container itself (all init containers incl. daprd have
#   started by then). No init containers here.
# STARTUP (command below, every pod start, both steps idempotent, then exec → uvicorn is PID 1):
#   1. idea-board-db-bootstrap  create DB/app user (OWNER secret + app secret)
#   2. alembic upgrade head     migrations as OWNER (DAPR_DB_SECRET_NAME=idea-board-db-owner)
#   3. uvicorn                  the API (app secret idea-board-db-app, default)
# PROBES: liveness /healthz (process only) · readiness /readyz (DB) · startup gives up to
#   180 s for Dapr + bootstrap + migrations + DB pool creation.
# SECURITY: matches PSA "restricted" + read-only root FS (/tmp is the only writable dir).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below desired capacity during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: backend
        # Prometheus scrapes the app's /metrics; Dapr's own metrics are not needed.
        dapr.io/enable-metrics: "false"
        # Prometheus (kubernetes-pods job) scrapes the app's /metrics – the health gate's data.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          image: backend
          imagePullPolicy: IfNotPresent
          # Same uvicorn flags as the Dockerfile CMD (keep both in sync).
          command:
            - sh
            - -c
            - >-
              idea-board-db-bootstrap &&
              DAPR_DB_SECRET_NAME=idea-board-db-owner alembic upgrade head &&
              exec uvicorn idea_board.main:app --host 0.0.0.0 --port 8000
              --proxy-headers --forwarded-allow-ips '*' --timeout-graceful-shutdown 20
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while the endpoint is removed from Services/Envoy (avoids
              # 502s during rolling updates). `sleep` action needs no shell in the image.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
