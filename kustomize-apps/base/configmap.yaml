# Non-secret settings for the backend (12-factor: config in env vars).
# Overlays change per-cloud values (e.g. APP_ENV) with a patch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  APP_ENV: base
  LOG_LEVEL: INFO
  # dapr = fetch host, port, dbname, user, password and sslmode from the Dapr secret store
  # (AWS Secrets Manager / GCP Secret Manager → RDS / Cloud SQL). Nothing DB-related here.
  DB_CREDENTIALS_SOURCE: dapr
  # Fallback only; the secret's own sslmode wins. Both RDS and Cloud SQL enforce TLS.
  DB_SSLMODE: require
  FAULT_INJECTION_RATE: "0"
