# Namespace for the app.
# Pod Security Admission "restricted" = the strictest built-in profile: non-root, no
# privilege escalation, dropped capabilities, seccomp. Violating pods are REJECTED.
apiVersion: v1
kind: Namespace
metadata:
  name: idea-board
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
