# Dapr component "secretstore" on GCP: same NAME as locally (dapr/components/local),
# different TYPE. No key file: the sidecar uses the pod's Workload Identity
# (terraform/modules/gcp/cloudsql grants the backend KSA secretAccessor).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.gcp.secretmanager
  version: v1
  metadata:
    - name: project_id
      value: project-7e93dfd0-5ad8-4ac0-aec
