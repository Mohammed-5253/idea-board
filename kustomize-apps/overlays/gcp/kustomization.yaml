# Overlay: GCP (GKE). Synced by Argo CD (terraform/modules/common/argocd, app_path).
# Database: Cloud SQL PostgreSQL (terraform/modules/gcp/cloudsql); credentials in Secret backend-db (terraform).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- managed-certificate.yaml
- frontend-config.yaml

patches:
- path: patch-config.yaml
- path: patch-ingress.yaml

images:
- name: backend
  newName: asia-south1-docker.pkg.dev/project-7e93dfd0-5ad8-4ac0-aec/idea-board/backend
  newTag: 2.0.0-4b7b076-30
- name: frontend
  newName: asia-south1-docker.pkg.dev/project-7e93dfd0-5ad8-4ac0-aec/idea-board/frontend
  newTag: 2.0.0-4b7b076-30
