# Overlay: GCP (GKE). Synced by Argo CD (terraform/modules/common/argocd, app_path).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-config.yaml
  - path: patch-ingress.yaml
images:
  - name: backend
    newName: asia-south1-docker.pkg.dev/<GCP_PROJECT_ID>/idea-board/backend
    newTag: latest
  - name: frontend
    newName: asia-south1-docker.pkg.dev/<GCP_PROJECT_ID>/idea-board/frontend
    newTag: latest
