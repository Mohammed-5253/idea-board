# IRSA: the backend pod (its Dapr sidecar) assumes this role to read the DB secrets.
# Role created by terraform/modules/aws/rds (output backend_role_arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::326435482847:role/idea-board-backend
