# Dapr component "secretstore" on AWS: same NAME as locally (dapr/components/local),
# different TYPE. No keys: the sidecar uses the pod's IRSA role (patch-serviceaccount.yaml).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.aws.secretmanager
  version: v1
  metadata:
    - name: region
      value: ap-south-1
