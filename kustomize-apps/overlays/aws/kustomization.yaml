# Overlay: AWS (EKS). Synced by Argo CD (terraform/modules/common/argocd, app_path).
# Database: RDS PostgreSQL (terraform/modules/aws/rds); credentials via Dapr (base/backend-deployment.yaml).
# Dapr secretstore → AWS Secrets Manager, using the IRSA role on the backend ServiceAccount.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- dapr-secretstore.yaml

patches:
- path: patch-config.yaml
- path: patch-ingress.yaml
- path: patch-serviceaccount.yaml

images:
- name: backend
  newName: 326435482847.dkr.ecr.ap-south-1.amazonaws.com/idea-board/backend
  newTag: 2.0.0-d028698-22
- name: frontend
  newName: 326435482847.dkr.ecr.ap-south-1.amazonaws.com/idea-board/frontend
  newTag: 2.0.0-d028698-22
