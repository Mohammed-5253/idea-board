# =============================================================================
# FILE: dapr/components/local/secretstore.yaml
# WHAT: Dapr component named "secretstore" for LOCAL development (docker-compose).
# WHY:  The backend always calls GET /v1.0/secrets/secretstore/<name>. Only THIS file
#       changes per environment (ADR-018) – same NAME, different TYPE:
#         local  → secretstores.local.file           (this file)
#         AWS    → secretstores.aws.secretmanager     (deploy/apps/.../overlays/aws, Phase 6)
#         GCP    → secretstores.gcp.secretmanager     (deploy/apps/.../overlays/gcp, Phase 7)
# multiValued: "true" → each top-level key in the JSON file is one secret whose value is
#   a map, e.g. GET .../idea-board-db-app → {"username": ..., "password": ..., "host": ...}
# SECURITY NOTE: local.file is for development only (plain JSON on disk). The file is
#   generated by docker-compose from env vars (`configs:` in docker-compose.yml) and is
#   never committed. In the cloud, secrets live in AWS Secrets Manager / GCP Secret Manager.
# LEARN: docs/learning/13-docker-compose-and-dapr-local.md
# =============================================================================
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    - name: secretsFile
      value: /run/dapr-secrets/secrets.json
    - name: multiValued
      value: "true"
