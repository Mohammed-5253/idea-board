# =============================================================================
# CI pipeline – test → build → push → update kustomize-apps (Argo CD deploys)
#
# Pull request : tests only (nothing is pushed).
# Push to main : tests only (nothing is pushed).
# Run workflow : the OPERATOR picks the cloud(s) (aws, gcp or aws,gcp) →
#                tests + AI infra check (selected clouds' terraform inventory vs changes since
#                their last deploy; COMPATIBLE: no stops the release) → build both images ONCE →
#                push to the selected clouds' registries only → ONE commit with the new tag in
#                kustomize-apps/overlays/<selected cloud> → Argo CD deploys → verify-deploy waits
#                for Argo CD; on failure the AI explains it in a GitHub issue assigned to the repo
#                owner (GitHub emails it).
#
# IMAGE TAG    : <version.txt>-<short commit SHA>-<run number>, e.g. 1.0.0-a1b2c3d-42
# CONFIG       : repository VARIABLES, no code change:
#                  AWS_REGISTRY     <account>.dkr.ecr.<region>.amazonaws.com/idea-board
#                  AWS_REGION       e.g. ap-south-1
#                  AWS_CI_ROLE_ARN  terraform/modules/aws/github-oidc output
#                  GCP_REGISTRY     <region>-docker.pkg.dev/<project>/idea-board
#                  GCP_WIF_PROVIDER, GCP_CI_SERVICE_ACCOUNT  terraform/modules/gcp/github-wif outputs
#                  EKS_CLUSTER, GKE_CLUSTER, GKE_LOCATION  verify-deploy reads Argo CD there
#                Login is OIDC/WIF only. NO cloud keys are stored in GitHub.
# SECURITY     : every action pinned to a commit SHA; each job gets only the permissions
#                it needs.
# =============================================================================
name: ci

on:
  pull_request:
    paths: ["app/**", "version.txt", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    # kustomize-apps/ is NOT listed → the pipeline's own tag-update commit never re-triggers it.
    paths: ["app/**", "version.txt", ".github/workflows/ci.yml"]
  workflow_dispatch: # "Run workflow" button: the ONLY way to build and deploy
    inputs:
      targets:
        description: Build, push images to and deploy on
        type: choice
        options: [aws, gcp, "aws,gcp"]
        default: aws

permissions: {}

# One run per branch at a time; on main, queue (never cancel half-way through a release).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  test-backend:
    name: test · backend (ruff + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest tests/unit

  # ---------------------------------------------------------------------------
  test-frontend:
    name: test · frontend (lint + tests + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Compute the image tag ONCE so both images (and the manifest update) use the same one.
  version:
    name: version · compute image tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      targets: ${{ steps.tag.outputs.targets }} # e.g. "aws,gcp"; empty (push/PR) → no build/deploy
      targets_json: ${{ steps.tag.outputs.targets_json }} # e.g. ["aws","gcp"] for a matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          targets: ${{ inputs.targets }} # empty on push / pull_request
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          tag="${version}-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          for t in ${targets//,/ }; do
            case "$t" in aws|gcp) ;; *) echo "::error::unknown cloud '$t' (use aws, gcp or aws,gcp)"; exit 1 ;; esac
          done
          json="$(jq -Rc 'split(",")' <<<"$targets")"
          { echo "tag=$tag"; echo "targets=$targets"; echo "targets_json=$json"; } >> "$GITHUB_OUTPUT"
          echo "### Image tag: \`$tag\` → ${targets:-no deploy (use Run workflow)}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # AI infra check for the SELECTED clouds: does the code being released need cloud
  # resources their Terraform state does not have? Evidence per cloud: its inventory
  # (terraform/<cloud>/inventory.txt, refreshed by terraform/tf.sh) + the diff since the
  # source commit of its last deploy(…) commit. `COMPATIBLE: no` stops the release.
  infra-check:
    name: ai · infra check (${{ needs.version.outputs.targets }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DEPLOY_TARGETS: ${{ needs.version.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history → find each cloud's last deployed source commit
          persist-credentials: false
      - env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          { for t in ${DEPLOY_TARGETS//,/ }; do
              echo "## Inventory: $t"; cat "terraform/$t/inventory.txt" 2>/dev/null; echo
            done
            for t in ${DEPLOY_TARGETS//,/ }; do
              # deploy(<clouds>) commits carry "Source commit: <sha>" (update-manifests below).
              src="$(git log -1 --grep='^deploy(' --format=%B -- "kustomize-apps/overlays/$t" | sed -n 's/^Source commit: //p')"
              git cat-file -e "${src:-none}^{commit}" 2>/dev/null || src="$(git rev-list --max-parents=0 HEAD | tail -1)"
              echo "## Diff ($t: changes since deployed ${src::7})"
              git diff "$src" HEAD -- app kustomize-apps terraform ':!kustomize-apps/overlays/*/kustomization.yaml' ':!terraform/*/inventory.txt' \
                ':!terraform/argo-cd' | head -c 60000 # vendored charts = noise
            done; } | python3 ci/ai/assist.py infra > infra.md
          cat infra.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'COMPATIBLE: no' infra.md; then
            echo "::error::AI infra check: $DEPLOY_TARGETS is missing infrastructure this release needs (see summary). Run terraform/tf.sh <cloud> apply, commit inventory.txt, then retry."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  build-push:
    name: build · push (${{ matrix.image }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend, version, infra-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token → AWS role / GCP Workload Identity Federation
    strategy:
      matrix:
        image: [backend, frontend]
    env:
      DEPLOY_TARGETS: ${{ needs.version.outputs.targets }}
      AWS_REGISTRY: ${{ vars.AWS_REGISTRY }}
      GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: contains(needs.version.outputs.targets, 'aws')
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: contains(needs.version.outputs.targets, 'aws')
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - if: contains(needs.version.outputs.targets, 'gcp')
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - if: contains(needs.version.outputs.targets, 'gcp')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.GCP_REGISTRY }} # docker uses only the host part
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      # Registry tags are IMMUTABLE. A "Re-run" keeps the same run number → same tag →
      # only push to registries that do not have it yet.
      - id: tags
        run: |
          tags=""
          for t in ${DEPLOY_TARGETS//,/ }; do
            case "$t" in
              aws) reg="$AWS_REGISTRY" ;;
              gcp) reg="$GCP_REGISTRY" ;;
            esac
            [ -n "$reg" ] || { echo "::error::repository variable for '$t' registry is empty"; exit 1; }
            ref="$reg/${{ matrix.image }}:$TAG"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::notice::$ref already exists – push skipped"
            else
              tags+="$ref"$'\n'
            fi
          done
          { echo "list<<EOF"; printf '%s' "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - if: steps.tags.outputs.list != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tags.outputs.list != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.image }}
          platforms: linux/amd64 # EKS (t3.large) and GKE (e2-standard-2) nodes are x86_64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: APP_VERSION=${{ env.TAG }} # backend serves it at /api/version; frontend ignores it
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # GitOps hand-off: write the new tag into Git. Argo CD in each cluster does the deployment.
  update-manifests:
    name: deploy · update kustomize-apps/overlays (${{ needs.version.outputs.targets }})
    needs: [version, build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the tag-update commit to main
    env:
      DEPLOY_TARGETS: ${{ needs.version.outputs.targets }}
      AWS_REGISTRY: ${{ vars.AWS_REGISTRY }}
      GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set image tags (kustomize edit)
        run: |
          for t in ${DEPLOY_TARGETS//,/ }; do
            case "$t" in aws) reg="$AWS_REGISTRY" ;; gcp) reg="$GCP_REGISTRY" ;; esac
            (cd "kustomize-apps/overlays/$t" &&
              kustomize edit set image "backend=$reg/backend:$TAG" "frontend=$reg/frontend:$TAG")
          done
          git diff
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomize-apps/overlays
          git commit -m "deploy($DEPLOY_TARGETS): images $TAG" -m "Source commit: $GITHUB_SHA" \
            -m "$(git log -1 --format=%s "$GITHUB_SHA" 2>/dev/null)"
          # Another commit may have landed meanwhile → rebase and retry a few times.
          for _ in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - run: echo "Deployed tag \`$TAG\` → Argo CD will sync overlays for $DEPLOY_TARGETS" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Wait until Argo CD runs the new tag (Synced + Healthy). On failure: collect Argo CD
  # status, pods, events and logs → AI explanation → GitHub issue assigned to the repo
  # owner (GitHub emails it). Read-only cluster access: terraform/modules/common/argocd RBAC.
  verify-deploy:
    name: verify · argo cd sync (${{ matrix.cloud }})
    needs: [version, update-manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token → AWS role / GCP Workload Identity Federation
      issues: write # open the failure issue
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.version.outputs.targets_json) }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: matrix.cloud == 'aws'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}"

      - if: matrix.cloud == 'gcp'
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          # userinfo.email: GKE then sees the SA email (bound by the RBAC in
          # modules/common/argocd), not its numeric ID → otherwise Forbidden.
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email
      # kubeconfig with the WIF access token (no gke-gcloud-auth-plugin needed).
      - if: matrix.cloud == 'gcp'
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          read -r endpoint ca < <(gcloud container clusters describe "${{ vars.GKE_CLUSTER }}" \
            --location "${{ vars.GKE_LOCATION }}" \
            --format 'value(endpoint,masterAuth.clusterCaCertificate)')
          echo "$ca" | base64 -d > "$RUNNER_TEMP/gke-ca.crt"
          kubectl config set-cluster gke --server "https://$endpoint" --certificate-authority "$RUNNER_TEMP/gke-ca.crt"
          kubectl config set-credentials ci --token "$TOKEN"
          kubectl config set-context gke --cluster gke --user ci
          kubectl config use-context gke

      - id: wait
        run: |
          # Argo CD polls Git every ~3 min, then the rollout runs → allow 15 min.
          for _ in $(seq 90); do
            app="$(kubectl -n argocd get application idea-board -o json)"
            images="$(jq -r '.status.summary.images[]?' <<<"$app")"
            sync="$(jq -r '.status.sync.status' <<<"$app")"
            health="$(jq -r '.status.health.status' <<<"$app")"
            phase="$(jq -r '.status.operationState.phase // ""' <<<"$app")"
            echo "sync=$sync health=$health phase=$phase"
            if grep -q ":$TAG\$" <<<"$images"; then
              [ "$sync" = Synced ] && [ "$health" = Healthy ] && exit 0
              case "$phase/$health" in Failed/*|Error/*|*/Degraded) break ;; esac
            fi
            sleep 10
          done
          echo "::error::Argo CD did not reach Synced+Healthy with $TAG (sync=$sync health=$health phase=$phase)"
          exit 1

      - if: failure() && steps.wait.conclusion == 'failure'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GH_TOKEN: ${{ github.token }}
          CLOUD: ${{ matrix.cloud }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "## Argo CD Application status"
            kubectl -n argocd get application idea-board -o json | jq '.status | {sync, health, operationState, conditions, resources: [.resources[]? | select(.health.status != "Healthy" or .status != "Synced")]}'
            echo "## Pods"; kubectl -n idea-board get pods -o wide
            echo "## Events"; kubectl -n idea-board get events --sort-by .lastTimestamp | tail -40
            echo "## Logs of not-ready pods"
            for p in $(kubectl -n idea-board get pods -o json | jq -r '.items[] | select([.status.containerStatuses[]?.ready] | all | not) | .metadata.name'); do
              echo "### $p"; kubectl -n idea-board logs "$p" --all-containers --tail 40 2>&1 || true
            done; } > evidence.txt 2>&1 || true
          python3 ci/ai/assist.py deploy < evidence.txt > explain.md
          { echo "Argo CD did not deploy \`$TAG\` on **$CLOUD**. CI run: $RUN_URL"; echo
            cat explain.md; echo
            echo "<details><summary>Raw evidence</summary>"; echo; echo '```'; head -c 50000 evidence.txt; echo '```'; echo "</details>"; } > issue.md
          gh issue create --title "Deploy failed on $CLOUD: $TAG" --body-file issue.md --assignee "$OWNER"
          cat issue.md >> "$GITHUB_STEP_SUMMARY"
